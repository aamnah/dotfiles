# install uv: curl -LsSf https://astral.sh/uv/install.sh | sh 
# install tmuxp: uv tool install tmuxp
# load layout: tmuxp load tmuxp.yaml
windows:
  - window_name: main
    layout: bd3c,305x53,0,0{108x53,0,0,46,101x53,109,0,47,94x53,211,0[94x34,211,0,48,94x18,211,35{66x18,211,35,49,27x18,278,35[27x9,278,35,50,27x8,278,45,51]}]}
    panes:
      - shell_command: 
        focus: true
      - 
      - 
      - shell-command:
      - peaclock
      - watch -n 3600 'curl --compressed -s "wttr.in/{jkl}?format=%c%C\n%t%20%28%f%29\n%w%20%20%p\n%m%20%20UV%3A%20%u\n"'
      # - shell_command: 
      #   focus: true
      # You can run multiple commands like this
      #   - export NODE_ENV=development
      #   - nvm use lts


