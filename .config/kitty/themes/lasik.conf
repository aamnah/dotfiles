#!/bin/bash
#-----------------------------------------------------------------------
#          File: ~/.config/kitty/themes/lasik.conf
#   Description: Lasik theme for Kitty terminal,
#                ported from https://github.com/aamnah/lasik-konsole-theme
# Compatibility: Debian, Ubuntu, Armbian, macOS
#       Version: 0.1.1
#        Author: Aamnah
#          Link: https://aamnah.com
#          Date: 2026-04-27
#       Lastmod: 2026-05-21
#-----------------------------------------------------------------------
# reload settings with: Ctrl+Shift+F5

foreground              #ffffff  # WHITE
background              #01030a  # OBSIDIAN

selection_foreground    #ffffff  # WHITE
selection_background    #3c476c  # SLATE

cursor                  #ffffff  # WHITE
cursor_text_color       #01030a  # OBSIDIAN

url_color               #02bbcc  # SAPPHIRE

# The basic 16 terminal colors
color0                  #3c476c  # SLATE
color1                  #d24e6d  # RED
color2                  #a0c38f  # GREEN
color3                  #ffe2a3  # YELLOW
color4                  #569cd6  # BLUE
color5                  #c175ea  # MAUVE
color6                  #02bbcc  # SAPPHIRE
color7                  #d1dafa  # LAVENDER

# Bright colors, mapped from Konsole *Intense values
color8                  #2a324b  # SLATE_INTENSE
color9                  #bb3050  # RED_INTENSE
color10                 #81b668  # GREEN_INTENSE
color11                 #ffd370  # YELLOW_INTENSE
color12                 #3184c9  # BLUE_INTENSE
color13                 #ae49e4  # MAUVE_INTENSE
color14                 #01747e  # SAPPHIRE_INTENSE
color15                 #e8ecfd  # LAVENDER_INTENSE

# Optional UI colors
## Tab bars
tab_bar_background      #01030a  # OBSIDIAN
inactive_tab_background #2a324b  # SLATE_INTENSE
inactive_tab_foreground #6A78A4  # SLATE_FAINT

tab_bar_style           slant
tab_title_template      "{index} {title}"
tab_activity_symbol     "●"


## Distniguish window splits
inactive_text_alpha     0.1
active_border_color     #c175ea  # MAUVE
inactive_border_color   #2a324b  # SLATE_INTENSE
window_padding_width    8
window_border_width     1pt
draw_minimal_borders    no
