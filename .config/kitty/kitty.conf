#!/bin/bash
#-----------------------------------------------------------------------
#          File: ~/.config/kitty/kitty.conf
#   Description: Default configuration for Kitty terminal
# Compatibility: Debian, Ubuntu, Armbian, macOS
#       Version: 0.1.0
#        Author: Aamnah
#          Link: https://aamnah.com
#          Date: 2024-04-24
#       Lastmod: 2024-05-21
#-----------------------------------------------------------------------

# UI
font_size        12.0
font_family      Hasklug Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

# Theme
# include themes/catppuccin-mocha.conf
include themes/lasik.conf

# Let shift+drag select text even when tmux has mouse mode on.
# Without these, kitty forwards the click to tmux instead of selecting.
mouse_map shift+left press       grabbed,ungrabbed mouse_selection normal
mouse_map shift+left release     grabbed,ungrabbed mouse_selection end
mouse_map shift+left doublepress grabbed,ungrabbed mouse_selection word
mouse_map shift+left triplepress grabbed,ungrabbed mouse_selection line

# layout bindings
## tall auto-arranges windows
## for tmux-like horizontal/vertical splits use splits layout
enabled_layouts  splits,stack,tall

# --cwd=current makes the new split open in the same dir
map ctrl+shift+\ launch --location=vsplit --cwd=current
map ctrl+shift+- launch --location=hsplit --cwd=current

# navigate between splits
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down

# default window size
# if remember_window_size yes, then
# the initial_window_* values only apply on the very first launch
# after that kitty restores whatever size was last used
remember_window_size no
# default: yes
initial_window_width 120c
# default: 640 (pixels)
initial_window_height 32c
# default: 400 (pixels)
